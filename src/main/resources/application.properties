spring.application.name=stayhub-v2

# Profile / runtime
spring.profiles.active=dev
server.port=8080

# ----------------------------------------------------------------------------
# Database (PostgreSQL)
# ----------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/stayhub_v2
spring.datasource.username=postgres
spring.datasource.password=0818

# Dev default
spring.jpa.hibernate.ddl-auto=update

# ----------------------------------------------------------------------------
# JWT
# ----------------------------------------------------------------------------
# Dev-only default secret. Change for prod.
JWT_SECRET_KEY=9f2a6d1c7e4b8a03d5c1f6e0b2a79c4d8e1f0a6c3b7d2e9a5c0f1d8b6a3e7c2f

# 24 hours (ms)
JWT.TIME.EXPIRATION=86400000

# ----------------------------------------------------------------------------
# Email (SMTP)
# ----------------------------------------------------------------------------
# Defaults point to local SMTP catcher (Mailpit/MailHog).
spring.mail.host=localhost
spring.mail.port=1025

# Not secret, but usually provider-specific
spring.mail.username=stayhub@example.test

# Password is not required when SMTP auth is disabled (default below).
spring.mail.password=example

# Defaults for local SMTP catcher
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# ----------------------------------------------------------------------------
# StayHub business config (Payments)
# ----------------------------------------------------------------------------
# Required in code.
stayhub.payment.bank-account=0000000000

stayhub.payment.deposit-percentage=20
stayhub.payment.deadline-days=3

# ----------------------------------------------------------------------------
# File uploads
# ----------------------------------------------------------------------------
app.upload.dir=./uploads
app.base-url=http://localhost:8080
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
