openapi: 3.0.3
info:
  title: StayHub v2 API
  version: 1.0.0
  description: |
    API contract for StayHub.

    This `openapi.yaml` is intended as the implementation target for the checklist in `task.md`.
servers:
  - url: http://localhost:8080
    description: Local server

tags:
  - name: Auth
    description: User authentication and password flows
  - name: Users
    description: User profile management
  - name: Accommodations
    description: Rural houses (casa rural) management and search
  - name: Rooms
    description: Rooms inside an accommodation
  - name: Availability
    description: Availability querying and calendar management
  - name: Bookings
    description: Reservation lifecycle
  - name: Payments
    description: Deposit payments and deadlines
  - name: Notifications
    description: In-app notifications for guests and hosts
  - name: Rental Packages
    description: Rental package CRUD
  - name: Reviews
    description: Comments and ratings (post-stay)
  - name: Metrics
    description: Basic accommodation metrics

security:
  - bearerAuth: []

paths:
  /api/v2/users/auth/signup:
    post:
      tags: [Auth]
      summary: Register a new user
      operationId: signupUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSignupRequest'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSignupResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v2/users/auth/login:
    post:
      tags: [Auth]
      summary: Login user
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLoginRequest'
      responses:
        '200':
          description: User logged in successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v2/users/auth/forgot-password:
    post:
      tags: [Auth]
      summary: Forgot password
      description: Generates a recovery code and sends it via email
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Recovery code sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v2/users/auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password
      description: Resets user password using a recovery code
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Invalid or expired recovery code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v2/users/auth/change-password:
    put:
      tags: [Auth]
      summary: Change password
      description: Changes user's password requiring the current password
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v2/users/me:
    get:
      tags: [Users]
      summary: Get my profile
      operationId: getMyProfile
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Users]
      summary: Update my profile
      operationId: updateMyProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Users]
      summary: Deactivate my account
      operationId: deactivateMyAccount
      responses:
        '200':
          description: Account deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v2/accommodations:
    post:
      tags: [Accommodations]
      summary: Create an accommodation
      description: Host creates a new rural house listing.
      operationId: createAccommodation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccommodationCreateRequest'
      responses:
        '201':
          description: Accommodation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccommodationDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Accommodation code already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags: [Accommodations]
      summary: Search accommodations
      description: |
        Search accommodations by city (poblacion) and optional filters.
        This endpoint is used for listing and search results.
      operationId: searchAccommodations
      parameters:
        - in: query
          name: city
          required: false
          schema:
            type: string
          description: City (poblacion) filter
        - in: query
          name: q
          required: false
          schema:
            type: string
          description: Free text query (title/description)
        - in: query
          name: guests
          required: false
          schema:
            type: integer
            minimum: 1
          description: Minimum capacity required
        - in: query
          name: startDate
          required: false
          schema:
            type: string
            format: date-time
          description: Desired check-in datetime (for availability filtering)
        - in: query
          name: endDate
          required: false
          schema:
            type: string
            format: date-time
          description: Desired check-out datetime (for availability filtering)
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: size
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Paginated results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedAccommodationSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v2/hosts/me/accommodations:
    get:
      tags: [Accommodations]
      summary: List my accommodations (host)
      description: Returns accommodations owned by the authenticated host.
      operationId: listMyAccommodations
      parameters:
        - in: query
          name: includeDeleted
          required: false
          schema:
            type: boolean
            default: false
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: size
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Paginated results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedAccommodationSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v2/accommodations/by-code/{code}:
    get:
      tags: [Accommodations]
      summary: Get accommodation by code
      operationId: getAccommodationByCode
      parameters:
        - in: path
          name: code
          required: true
          schema:
            type: string
            minLength: 4
            maxLength: 32
          description: Unique accommodation code
      responses:
        '200':
          description: Accommodation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccommodationDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v2/accommodations/{id}:
    get:
      tags: [Accommodations]
      summary: Get accommodation by id
      operationId: getAccommodationById
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
          description: Accommodation id
      responses:
        '200':
          description: Accommodation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccommodationDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Accommodations]
      summary: Update accommodation
      operationId: updateAccommodation
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccommodationUpdateRequest'
      responses:
        '200':
          description: Accommodation updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccommodationDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Accommodations]
      summary: Deactivate accommodation
      description: Soft deletes an accommodation if it has no future active reservations, validating if user is the owner.
      operationId: deactivateAccommodation
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Accommodation deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Active future reservations exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v2/accommodations/{id}/images:
    post:
      tags: [Accommodations]
      summary: Upload accommodation images
      description: |
        Upload one or more images for an accommodation.
        The backend is responsible for storing the files and returning public URLs.
      operationId: uploadAccommodationImages
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                kind:
                  type: string
                  enum: [MAIN, GALLERY]
                  default: GALLERY
              required: [files]
      responses:
        '200':
          description: Uploaded images
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ImageResource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Accommodations]
      summary: Remove an accommodation image
      operationId: deleteAccommodationImage
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
        - in: query
          name: imageId
          required: true
          schema:
            type: string
          description: Image resource identifier
      responses:
        '200':
          description: Image removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v2/accommodations/{id}/rooms:
    get:
      tags: [Rooms]
      summary: List rooms for an accommodation
      operationId: listRooms
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Rooms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Room'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Rooms]
      summary: Create room
      description: Creates a room and generates a unique room code within the accommodation.
      operationId: createRoom
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomCreateRequest'
      responses:
        '201':
          description: Room created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v2/rooms/{roomId}:
    put:
      tags: [Rooms]
      summary: Update room
      operationId: updateRoom
      parameters:
        - in: path
          name: roomId
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomUpdateRequest'
      responses:
        '200':
          description: Updated room
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Rooms]
      summary: Delete room
      operationId: deleteRoom
      parameters:
        - in: path
          name: roomId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Room deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v2/accommodations/{id}/availability/check:
    get:
      tags: [Availability]
      summary: Check availability for a date range
      operationId: checkAvailability
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
        - in: query
          name: startDate
          required: true
          schema:
            type: string
            format: date-time
        - in: query
          name: endDate
          required: true
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Availability status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityCheckResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v2/accommodations/{id}/availability/calendar:
    get:
      tags: [Availability]
      summary: Get availability calendar
      description: |
        Returns a calendar representation suitable for a visual calendar UI.
        Days may be AVAILABLE, BOOKED, BLOCKED, or UNDEFINED.
      operationId: getAvailabilityCalendar
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
        - in: query
          name: month
          required: true
          schema:
            type: string
            pattern: '^\\d{4}-\\d{2}$'
          description: Month in format YYYY-MM
      responses:
        '200':
          description: Calendar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityCalendarResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v2/accommodations/{id}/availability/rules:
    get:
      tags: [Availability]
      summary: List availability rules
      description: Host-defined availability/blocked periods.
      operationId: listAvailabilityRules
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AvailabilityRule'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Availability]
      summary: Replace availability rules
      description: |
        Host replaces the set of availability rules for an accommodation.
        This endpoint is the primary way to ensure "períodos no definidos" are handled
        by explicitly defining availability/blocked periods.
      operationId: replaceAvailabilityRules
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/AvailabilityRuleInput'
      responses:
        '200':
          description: Updated rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AvailabilityRule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v2/bookings/book:
    post:
      tags: [Bookings]
      summary: Create a new accommodation reservation
      operationId: bookAccommodation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReservationRequest'
      responses:
        '201':
          description: Reservation created (includes deposit payment summary)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateReservationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v2/bookings/{reservationId}:
    get:
      tags: [Bookings]
      summary: Get reservation detail by ID
      description: Only the guest or the host of the accommodation can access it.
      operationId: getReservationById
      parameters:
        - in: path
          name: reservationId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Reservation detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveReservationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v2/bookings/my-reservations:
    get:
      tags: [Bookings]
      summary: Get paginated list of my reservations
      description: If HOST returns reservations of owned accommodations, else guest reservations.
      operationId: getMyReservations
      parameters:
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Reservations page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageReservationSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v2/bookings/{reservationId}/cancel:
    post:
      tags: [Bookings]
      summary: Cancel a reservation
      description: Cancels an ACTIVE reservation. Allowed for the guest or the host.
      operationId: cancelReservation
      parameters:
        - in: path
          name: reservationId
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelReservationRequest'
      responses:
        '200':
          description: Reservation cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveReservationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v2/bookings/{reservationId}/payment-summary:
    get:
      tags: [Payments]
      summary: Get reservation payment summary
      operationId: getReservationPaymentSummary
      parameters:
        - in: path
          name: reservationId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Payment summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationPaymentSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v2/bookings/{reservationId}/payments/deposit:
    post:
      tags: [Payments]
      summary: Report deposit payment
      description: |
        Marks the reservation deposit as paid.
        This can be implemented as either an admin/host confirmation flow or an automated reconciliation.
      operationId: reportDepositPayment
      parameters:
        - in: path
          name: reservationId
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepositPaymentReportRequest'
      responses:
        '200':
          description: Deposit payment registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationPaymentSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v2/bookings/{reservationId}/confirmation/resend:
    post:
      tags: [Bookings]
      summary: Resend reservation confirmation
      description: Triggers a new confirmation email for the reservation.
      operationId: resendReservationConfirmation
      parameters:
        - in: path
          name: reservationId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Confirmation email triggered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v2/notifications/payment-pending:
    get:
      tags: [Notifications]
      summary: Get pending payment notifications
      operationId: getPendingPaymentNotifications
      responses:
        '200':
          description: List of pending payment notifications (may be empty)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentNotification'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v2/notifications:
    get:
      tags: [Notifications]
      summary: List in-app notifications
      operationId: listNotifications
      parameters:
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: size
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Notifications page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageNotification'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v2/notifications/host:
    get:
      tags: [Notifications]
      summary: List host notifications
      description: Notifications relevant for owners (new bookings, cancellations, reviews).
      operationId: listHostNotifications
      parameters:
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Notifications page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageNotification'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v2/notifications/{notificationId}/read:
    post:
      tags: [Notifications]
      summary: Mark notification as read
      operationId: markNotificationRead
      parameters:
        - in: path
          name: notificationId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Marked as read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v2/accommodations/{id}/rental-packages:
    get:
      tags: [Rental Packages]
      summary: List rental packages
      operationId: listRentalPackages
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Packages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RentalPackage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Rental Packages]
      summary: Create rental package
      operationId: createRentalPackage
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RentalPackageCreateRequest'
      responses:
        '201':
          description: Package created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalPackage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v2/rental-packages/{packageId}:
    put:
      tags: [Rental Packages]
      summary: Update rental package
      operationId: updateRentalPackage
      parameters:
        - in: path
          name: packageId
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RentalPackageUpdateRequest'
      responses:
        '200':
          description: Updated package
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalPackage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Rental Packages]
      summary: Delete rental package
      operationId: deleteRentalPackage
      parameters:
        - in: path
          name: packageId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Package deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v2/reviews:
    post:
      tags: [Reviews]
      summary: Create a review
      description: Only allowed if the reservation is COMPLETED (stay finished).
      operationId: createReview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewCreateRequest'
      responses:
        '201':
          description: Review created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Reservation not eligible for review (not completed or already reviewed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v2/accommodations/{id}/reviews:
    get:
      tags: [Reviews]
      summary: List reviews for an accommodation
      operationId: listAccommodationReviews
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: size
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Reviews page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageReview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v2/reviews/{reviewId}/response:
    post:
      tags: [Reviews]
      summary: Host response to a review
      operationId: respondToReview
      parameters:
        - in: path
          name: reviewId
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewHostResponseRequest'
      responses:
        '200':
          description: Updated review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v2/hosts/me/metrics:
    get:
      tags: [Metrics]
      summary: Get host metrics
      description: Basic metrics for accommodations owned by the authenticated host.
      operationId: getHostMetrics
      parameters:
        - in: query
          name: from
          required: false
          schema:
            type: string
            format: date
          description: Start date (inclusive)
        - in: query
          name: to
          required: false
          schema:
            type: string
            format: date
          description: End date (inclusive)
      responses:
        '200':
          description: Metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostMetricsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
          example: Invalid login attempt detected
        code:
          type: integer
          example: 401
      required: [message, code]

    MessageResponse:
      type: object
      properties:
        message:
          type: string
          example: Operacion realizada exitosamente
      required: [message]

    TokenResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzUxMiJ9.eyJzdWIiOiJ1c2VyQGV4YW1wbGUuY29tIiwiZXhwIjoxNzI1ODk4MDAwfQ.abc
      required: [token]

    Role:
      type: string
      enum: [GUEST, HOST]

    ReservationStatus:
      type: string
      enum: [ACTIVE, COMPLETED, CANCELLED, NO_SHOW]

    CurrencyCode:
      type: string
      pattern: '^[A-Z]{3}$'
      example: COP

    UserSignupRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 100
          example: john.doe@example.com
        password:
          type: string
          format: password
          pattern: '^(?=.*[A-Z])(?=.*\\d).{8,}$'
          example: P@ssw0rd123
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
          uniqueItems: true
          minItems: 1
          example: [GUEST]
        fullName:
          type: string
          maxLength: 100
          example: John Doe
        phoneNumber:
          type: string
          pattern: '^\\+57\\s?\\d{10}$'
          example: +573101234567
        birthDate:
          type: string
          format: date
          example: 1990-01-01
        profilePicture:
          type: string
          format: uri
          nullable: true
          example: https://example.com/profile.jpg
      required: [email, password, roles, fullName, phoneNumber, birthDate]

    UserSignupResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 123
        email:
          type: string
          format: email
          example: john.doe@example.com
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
          uniqueItems: true
          example: [GUEST]
        fullName:
          type: string
          example: John Doe
        phoneNumber:
          type: string
          example: +573101234567
        birthDate:
          type: string
          format: date
          example: 1990-01-01
        profilePicture:
          type: string
          format: uri
          nullable: true
        createdAt:
          type: string
          format: date-time
          example: '2026-04-17T12:00:00Z'
      required: [id, email, roles, fullName, phoneNumber, birthDate, createdAt]

    UserLoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: john.doe@example.com
        password:
          type: string
          format: password
          example: P@ssw0rd123
      required: [email, password]

    ForgotPasswordRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: john.doe@example.com
      required: [email]

    ResetPasswordRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: john.doe@example.com
        code:
          type: string
          example: '123456'
        newPassword:
          type: string
          format: password
          pattern: '^(?=.*[0-9])(?=.*[a-z])(?=.*[A-Z])(?=.*[@#$%^&+=!])(?=\\S+$).{8,}$'
          example: NewP@ssw0rd!
      required: [email, code, newPassword]

    ChangePasswordRequest:
      type: object
      properties:
        currentPassword:
          type: string
          format: password
          example: OldP@ssw0rd123
        newPassword:
          type: string
          format: password
          pattern: '^(?=.*\\d)(?=.*\\p{Ll})(?=.*\\p{Lu})(?=.*[^\\p{L}\\d\\s]).{8,}$'
          example: NewP@ssw0rd!
      required: [currentPassword, newPassword]

    UserPublic:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        fullName:
          type: string
          example: Carlos Ramirez
        email:
          type: string
          format: email
          example: carlos.ramirez@email.com
        profilePicture:
          type: string
          format: uri
          nullable: true
      required: [id, fullName, email]

    UserMeResponse:
      allOf:
        - $ref: '#/components/schemas/UserPublic'
        - type: object
          properties:
            roles:
              type: array
              items:
                $ref: '#/components/schemas/Role'
              uniqueItems: true
            phoneNumber:
              type: string
              example: +573101234567
            birthDate:
              type: string
              format: date
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
          required: [roles, phoneNumber, birthDate, createdAt, updatedAt]

    UserUpdateRequest:
      type: object
      properties:
        fullName:
          type: string
          maxLength: 100
        phoneNumber:
          type: string
          pattern: '^\\+57\\s?\\d{10}$'
        profilePicture:
          type: string
          format: uri
          nullable: true
      additionalProperties: false

    AccommodationLegalInfo:
      type: object
      description: Legal information required to publish an accommodation.
      properties:
        registrationNumber:
          type: string
          description: Legal registration/license number.
          example: RNT-123456
        addressLine1:
          type: string
          example: Calle 10 # 20-30
        postalCode:
          type: string
          nullable: true
          example: '630001'
        country:
          type: string
          example: CO
        acceptedTermsAt:
          type: string
          format: date-time
          nullable: true
      required: [registrationNumber, addressLine1, country]

    AccommodationCreateRequest:
      type: object
      description: |
        Request body for creating an accommodation.

        The backend MUST generate a unique `code` for the accommodation (task: "Generar codigos unicos para casas").
      properties:
        title:
          type: string
          maxLength: 100
          example: Cabana en el Quindio
        description:
          type: string
          maxLength: 1000
          example: Hermosa cabana con vista a la montana.
        capacity:
          type: integer
          minimum: 1
          example: 6
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        pricePerNight:
          type: number
          format: double
          minimum: 0
          example: 120000
        mainImage:
          type: string
          format: uri
          nullable: true
        longitude:
          type: number
          format: double
          example: -75.6811
        latitude:
          type: number
          format: double
          example: 4.5339
        locationDescription:
          type: string
          maxLength: 200
          example: A dos cuadras del parque principal.
        city:
          type: string
          maxLength: 100
          example: Armenia
        images:
          type: array
          items:
            type: string
            format: uri
          description: Optional initial gallery image URLs.
        available:
          type: boolean
          default: true
        legal:
          $ref: '#/components/schemas/AccommodationLegalInfo'
      required: [title, description, capacity, currency, pricePerNight, longitude, latitude, locationDescription, city, legal]

    AccommodationUpdateRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        capacity:
          type: integer
          minimum: 1
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        pricePerNight:
          type: number
          format: double
          minimum: 0
        mainImage:
          type: string
          format: uri
          nullable: true
        longitude:
          type: number
          format: double
        latitude:
          type: number
          format: double
        locationDescription:
          type: string
          maxLength: 200
        city:
          type: string
          maxLength: 100
        available:
          type: boolean
        legal:
          $ref: '#/components/schemas/AccommodationLegalInfo'
      additionalProperties: false

    AccommodationSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        code:
          type: string
          example: ARM-QUINDIO-0001
        title:
          type: string
          example: Cabana en el Quindio
        city:
          type: string
          example: Armenia
        capacity:
          type: integer
          example: 6
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        pricePerNight:
          type: number
          format: double
          example: 120000
        mainImage:
          type: string
          format: uri
          nullable: true
        available:
          type: boolean
      required: [id, code, title, city, capacity, currency, pricePerNight, available]

    AccommodationDetail:
      allOf:
        - $ref: '#/components/schemas/AccommodationSummary'
        - type: object
          properties:
            description:
              type: string
              maxLength: 1000
            host:
              $ref: '#/components/schemas/UserPublic'
            longitude:
              type: number
              format: double
            latitude:
              type: number
              format: double
            locationDescription:
              type: string
              maxLength: 200
            images:
              type: array
              items:
                type: string
                format: uri
            legal:
              $ref: '#/components/schemas/AccommodationLegalInfo'
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
          required: [description, host, longitude, latitude, locationDescription, images, legal, createdAt, updatedAt]

    PagedAccommodationSummary:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/AccommodationSummary'
        page:
          $ref: '#/components/schemas/PageMeta'
      required: [content, page]

    PageMeta:
      type: object
      properties:
        number:
          type: integer
          example: 0
        size:
          type: integer
          example: 10
        totalElements:
          type: integer
          format: int64
          example: 57
        totalPages:
          type: integer
          example: 6
      required: [number, size, totalElements, totalPages]

    ImageResource:
      type: object
      properties:
        id:
          type: string
          example: img_01HXYZ...
        url:
          type: string
          format: uri
          example: https://cdn.example.com/accommodations/1/photo1.jpg
      required: [id, url]

    Room:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 10
        accommodationId:
          type: integer
          format: int64
          example: 1
        code:
          type: string
          description: Unique room code within its accommodation.
          example: ARM-QUINDIO-0001-R01
        name:
          type: string
          example: Habitacion principal
        capacity:
          type: integer
          minimum: 1
          example: 2
        images:
          type: array
          items:
            type: string
            format: uri
      required: [id, accommodationId, code, name, capacity]

    RoomCreateRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        capacity:
          type: integer
          minimum: 1
        images:
          type: array
          items:
            type: string
            format: uri
      required: [name, capacity]

    RoomUpdateRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        capacity:
          type: integer
          minimum: 1
        images:
          type: array
          items:
            type: string
            format: uri
      additionalProperties: false

    AvailabilityDayStatus:
      type: string
      enum: [AVAILABLE, BOOKED, BLOCKED, UNDEFINED]

    AvailabilityRuleType:
      type: string
      enum: [AVAILABLE, BLOCKED]

    AvailabilityRuleInput:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/AvailabilityRuleType'
        startDate:
          type: string
          format: date
          example: '2026-05-01'
        endDate:
          type: string
          format: date
          example: '2026-05-31'
        note:
          type: string
          maxLength: 200
          nullable: true
      required: [type, startDate, endDate]

    AvailabilityRule:
      allOf:
        - $ref: '#/components/schemas/AvailabilityRuleInput'
        - type: object
          properties:
            id:
              type: integer
              format: int64
              example: 1
            createdAt:
              type: string
              format: date-time
          required: [id, createdAt]

    AvailabilityCheckResponse:
      type: object
      properties:
        accommodationId:
          type: integer
          format: int64
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        available:
          type: boolean
        reason:
          type: string
          nullable: true
          example: Accommodation is already booked for the selected dates
      required: [accommodationId, startDate, endDate, available]

    AvailabilityCalendarResponse:
      type: object
      properties:
        accommodationId:
          type: integer
          format: int64
        month:
          type: string
          example: '2026-05'
        days:
          type: array
          items:
            $ref: '#/components/schemas/AvailabilityCalendarDay'
      required: [accommodationId, month, days]

    AvailabilityCalendarDay:
      type: object
      properties:
        date:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/AvailabilityDayStatus'
        reservationId:
          type: integer
          format: int64
          nullable: true
      required: [date, status]

    CreateReservationRequest:
      type: object
      description: Request body for creating a new reservation.
      properties:
        accommodationId:
          type: integer
          format: int64
          example: 1
        startDate:
          type: string
          format: date-time
          example: '2026-05-10T15:00:00'
        endDate:
          type: string
          format: date-time
          example: '2026-05-12T11:00:00'
        roomCode:
          type: string
          nullable: true
          description: Optional room code if booking is room-specific.
      required: [accommodationId, startDate, endDate]

    CreateReservationResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 12345
        bookingNumber:
          type: string
          example: SH-2026-000001
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        totalPrice:
          type: number
          format: double
          example: 1000.0
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        status:
          $ref: '#/components/schemas/ReservationStatus'
        accommodationId:
          type: integer
          format: int64
        accommodationTitle:
          type: string
        userId:
          type: integer
          format: int64
        depositAmount:
          type: number
          format: double
          example: 200.0
        depositPaid:
          type: boolean
          example: false
        bankAccountNumber:
          type: string
